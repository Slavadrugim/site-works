<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атлас профессий</title>
    <link rel="stylesheet" href="style.css">
    <meta name="yandex-verification" content="fec83d8bb80ba7f1" />
        <!-- Описание для Google -->
    <meta name="description" content="JobFinder — удобный атлас профессий. Узнай, сколько зарабатывают, сколько нужно учиться и какие есть плюсы и минусы у разных специальностей.">
    
    <!-- Open Graph для красивых ссылок в Telegram и ВК -->
    <meta property="og:title" content="JobFinder — Атлас профессий">
    <meta property="og:description" content="Справочник по профессиям с зарплатами, обучением и честными плюсами/минусами.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slavadrugim.github.io/site-works/">
</head>
<body>

    <header>
        <h1>JobFinder</h1>
        <p>Узнай, сколько зарабатывают и сколько нужно учиться</p>
    </header>

    <main>
        <!-- ЯРКИЙ РЕКЛАМНЫЙ БАННЕР -->
<div class="promo-banner">
    <div class="promo-text">
        <h2>нажми 🚀</h2>
        <p>здесь интересно!</p>
    </div>
    <a href="https://www.youtube.com/@%D0%BC%D0%BE%D0%BB%D0%BE%D0%B4%D0%BE%D0%B9-%D0%BC4%D1%85" target="_blank" class="promo-btn">
        <span>▶</span> Смотреть на YouTube
    </a>
</div>
        <!-- 1. Блок с поиском -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск профессии (например, 'кассир')...">
        </div>

        <!-- 2. Блок с кнопками-фильтрами -->
        <div class="filters">
            <button class="filter-btn active" data-category="Все">Все</button>
            <button class="filter-btn" data-category="Торговля">Торговля</button>
            <button class="filter-btn" data-category="IT">IT</button>
            <button class="filter-btn" data-category="Руководство">Руководство</button>
            <button class="filter-btn" data-category="Рабочие">Рабочие</button>
            <button class="filter-btn" data-category="Офис">Офис</button>
            
            <!-- НОВЫЕ КАТЕГОРИИ -->
            <button class="filter-btn" data-category="Творчество">Творчество</button>
            <button class="filter-btn" data-category="Медицина">Медицина</button>
            <button class="filter-btn" data-category="Образование">Образование</button>

            <!-- КНОПКА ИЗБРАННОГО (ТОЛЬКО ОДИН РАЗ) -->
            <button class="filter-btn" id="show-favorites-btn">❤️ Избранное</button>
        </div>

        <!-- 3. Блок, куда скрипт будет складывать карточки -->
        <div id="professions-list"></div>
                <!-- Модальное окно -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span id="close-modal">&times;</span>
                <h2 id="modal-title"></h2>
                <p id="modal-salary" class="salary"></p>
                <p id="modal-education"></p>
                <p id="modal-description"></p>
                <p id="modal-pros" class="pros"></p>
                <p id="modal-cons" class="cons"></p>
            </div>
        </div>
    </main>

    <!-- Подключаем скрипт в самом конце -->
    <script src="script.js"></script>
</body>
</html>
